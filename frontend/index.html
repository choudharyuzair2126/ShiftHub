<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ShiftHub — the city-based part-time job portal connecting students with local businesses." />
  <title>ShiftHub — Part-Time Jobs for Students</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="stylesheet" href="/static/css/components.css" />

  <!--
    API base URL — this is the ONLY line you change between environments.
    Locally: leave empty ("") so the browser hits the same origin (FastAPI).
    Production: replace with your Render backend URL.
  -->
  <script>
    window.SHIFTHUB_API_BASE = "https://shifthub-s98x.onrender.com/";
  </script>

  <script>
    (function () {
      try {
        var t = localStorage.getItem('sh_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app-loading" class="app-loading"><div class="app-loading__mark"></div></div>
  <div id="app"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
